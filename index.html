<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skerry</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #101418; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; width: 100%; height: 100%; }
  .box { position: fixed; color: #fff; font: 12px/1.45 -apple-system, BlinkMacSystemFont, sans-serif;
    background: rgba(10, 14, 20, 0.5); padding: 6px 10px; border-radius: 6px; pointer-events: none;
    text-shadow: 0 1px 2px rgba(0,0,0,.5); }
  /* performance and drivability figures (developer settings, B) under the status bar, between the columns */
  #hud { left: 50%; transform: translateX(-50%); top: 44px; display: none; text-align: center; }
  body.perf #hud { display: block; }
  /* the keys of the unit in view, just above the console */
  #help { left: 50%; transform: translateX(-50%); bottom: calc(var(--helm, 48px) + var(--cambar, 0px) + 6px); max-width: calc(100vw - 680px);
    text-align: center; color: #d7dde3; padding: 4px 10px; font-size: 11.5px; }
  /* the pad's button pictures (src/ui/glyphs.ts) in the help line and on the controls page */
  .pg { vertical-align: -4px; margin: 0 1px; }
  /* the settings live in the menu (Einstellungen) */
  .lil-gui.root { --width: 270px; }
  body:not(.menu-settings) .lil-gui.root { display: none; }
  #messages { position: fixed; left: 50%; top: 42px; transform: translateX(-50%); display: flex; flex-direction: column;
    align-items: center; gap: 4px; pointer-events: none; font: 600 13px -apple-system, sans-serif; }
  #messages div { background: rgba(10,14,20,.6); color: #f2e6c8; padding: 4px 10px; border-radius: 5px; text-shadow: 0 1px 2px #000; }
  #messages div.good { color: #9be27a; } #messages div.bad { color: #ff9a7a; }
  #crosshair { position: fixed; left: 50%; top: 50%; width: 34px; height: 34px; margin: -17px 0 0 -17px; display: none; pointer-events: none;
    background: radial-gradient(circle, rgba(255,230,170,.95) 0 2px, transparent 3px),
      linear-gradient(rgba(255,230,170,.85), rgba(255,230,170,.85)) center 0/2px 11px no-repeat,
      linear-gradient(rgba(255,230,170,.85), rgba(255,230,170,.85)) center 100%/2px 11px no-repeat,
      linear-gradient(rgba(255,230,170,.85), rgba(255,230,170,.85)) 0 center/11px 2px no-repeat,
      linear-gradient(rgba(255,230,170,.85), rgba(255,230,170,.85)) 100% center/11px 2px no-repeat; }
  #lock { position: fixed; width: 46px; height: 46px; margin: -23px 0 0 -23px; border: 2px solid #ef5a4a; display: none;
    pointer-events: none; color: #ef5a4a; font: 700 11px -apple-system, sans-serif; text-align: center; line-height: 104px; white-space: nowrap; }
  /* aiming aids (updateCrosshair in main.ts): the aim mode, the heat, the turret still turning, where to lead a moving
     target, the target under the crosshair, the hit marker and the arcs that show where fire comes from */
  #crosshair.zoom { transform: scale(.7); }
  #crosshair.hot { animation: xhot .5s steps(2) infinite; }
  @keyframes xhot { 50% { filter: sepia(1) saturate(6) hue-rotate(5deg); } }
  #crosshair.over { filter: sepia(1) saturate(8) hue-rotate(-35deg); animation: none; }
  #crosshair.over::after { content: attr(data-over); position: absolute; top: 40px; left: 50%; transform: translateX(-50%);
    color: #ffd2c8; font: 700 11px -apple-system, sans-serif; white-space: nowrap; text-shadow: 0 1px 2px #000; }
  #hitmark { position: fixed; left: 50%; top: 50%; width: 30px; height: 30px; margin: -15px 0 0 -15px; display: none; pointer-events: none;
    transform: rotate(45deg); --hm: rgba(255,255,255,.95);
    background: linear-gradient(var(--hm), var(--hm)) center 0/2px 9px no-repeat, linear-gradient(var(--hm), var(--hm)) center 100%/2px 9px no-repeat,
      linear-gradient(var(--hm), var(--hm)) 0 center/9px 2px no-repeat, linear-gradient(var(--hm), var(--hm)) 100% center/9px 2px no-repeat; }
  #hitmark.on { display: block; animation: hmfade .18s ease-out forwards; }
  #hitmark.kill { display: block; --hm: #ff5a46; animation: hmkill .4s ease-out forwards; }
  @keyframes hmfade { from { opacity: 1; } to { opacity: 0; } }
  @keyframes hmkill { from { opacity: 1; transform: rotate(45deg) scale(1.5); } to { opacity: 0; transform: rotate(45deg) scale(1.9); } }
  #crosshair.turn { opacity: .35; }
  #lead { position: fixed; width: 9px; height: 9px; margin: -6.5px 0 0 -6.5px; border: 2px solid #7fe0ff; transform: rotate(45deg);
    display: none; pointer-events: none; box-shadow: 0 0 4px rgba(0,0,0,.6); }
  #tinfo { position: fixed; left: 50%; top: calc(50% + 24px); transform: translateX(-50%); display: none; pointer-events: none; text-align: center;
    color: #ffb4a6; font: 700 11px -apple-system, sans-serif; white-space: nowrap; text-shadow: 0 1px 2px #000; }
  #tinfo.far { color: #ffd27a; }
  #tinfo i { display: block; width: 64px; height: 3px; margin: 3px auto 0; background: rgba(255,255,255,.25); }
  #tinfo b { display: block; height: 100%; background: #ef5a4a; }
  #incoming { position: fixed; left: 50%; top: 50%; width: 0; height: 0; pointer-events: none; }
  #incoming .arc { position: absolute; width: 240px; height: 240px; margin: -120px 0 0 -120px; border-radius: 50%; border: 5px solid transparent;
    border-top-color: rgba(239,90,74,.9); animation: arcfade 1.3s ease-in forwards; }
  @keyframes arcfade { from { opacity: 1; } to { opacity: 0; } }
  /* the Skua flown with the trackpad: where the finger holds the stick */
  #vstick { position: fixed; left: 50%; top: 50%; width: 84px; height: 84px; margin: -42px 0 0 -42px; border: 1px dashed rgba(255,230,170,.35);
    border-radius: 50%; display: none; pointer-events: none; }
  #vstick i { position: absolute; left: 50%; top: 50%; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; background: rgba(255,230,170,.9); }
  /* ===== map (M): a command console – status bar on top, a column of sections on the left, the chart table ===== */
  #map { position: fixed; inset: 0; display: none; background: transparent; z-index: 20; }
  /* above 1920×1080 the interface grows with the window (--ui from src/ui/scale.ts); the 3D picture and the map's canvas keep their own resolution */
  #deck, #helm, #cambar, #help, #messages, #hud, #menu, #supply, #guide, #tut, #train, #map > :not(canvas) { zoom: var(--ui, 1); }
  /* the camera bar over the Stoorworm's (src/ui/camBar.ts): the console's blue, so it reads apart from the ship's bronze */
  #cambar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--helm, 48px) + 4px); z-index: 21; display: flex; align-items: center; gap: 4px;
    padding: 4px 8px; background: rgba(8,24,32,.88); border: 1px solid #2c6f8a; border-radius: 6px; color: #cfe3ee; font: 600 11px -apple-system, sans-serif; white-space: nowrap; }
  #cambar button { display: flex; align-items: center; gap: 5px; height: 24px; min-width: 24px; justify-content: center; padding: 0 7px; color: #d9ecf5; background: rgba(4,14,20,.9);
    border: 1px solid #2c6f8a; border-radius: 3px; font: 600 11px -apple-system, sans-serif; letter-spacing: .03em; text-transform: uppercase; cursor: pointer; }
  #cambar button:hover:not(:disabled) { background: rgba(80,180,220,.16); }
  #cambar button:disabled { opacity: .35; cursor: default; }
  #cambar button svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  #cambar button.on { color: #062028; background: linear-gradient(180deg, #a8f0ff, #5cc8e6); border-color: #c8f6ff; box-shadow: 0 0 10px rgba(110,220,255,.7); }
  #cambar .cl { color: #7fb4c8; font: 700 10.5px -apple-system, sans-serif; letter-spacing: .1em; text-transform: uppercase; margin-right: 2px; }
  #cambar .cname { min-width: 92px; max-width: 170px; overflow: hidden; text-overflow: ellipsis; text-align: center; color: #f0f7fb; font-weight: 600; text-transform: none; }
  #cambar .czoom { min-width: 34px; text-align: center; color: #f0f7fb; font-variant-numeric: tabular-nums; }
  #cambar .sep { width: 1px; height: 18px; background: rgba(120,190,220,.25); margin: 0 4px; }
  body.in-menu #cambar, body.map-open #cambar, body.ui-hidden #cambar, body.intro #cambar { display: none; }
  @media (max-width: 1150px) { #cambar .cl, #cambar .bt { display: none; } }
  .skin { --cyan: 80, 220, 255; --gold: #c79b38; }
  #map canvas { width: 100%; height: 100%; display: block; cursor: crosshair; }
  .skin button { font: 600 12px -apple-system, sans-serif; color: #dfe6ec; cursor: pointer; }
  /* metal panels with cut corners and gold strokes */
  .skin .sec, .skin .mapbtns button, .skin .maptop {
    background: linear-gradient(90deg, rgba(242,196,106,.5), rgba(242,196,106,0) 55%) top left / 100% 1px no-repeat,
      linear-gradient(180deg, #1c262d 0%, #131b21 60%, #0e1519 100%);
    border: 1px solid #2c3a40; position: relative;
    box-shadow: inset 0 0 0 1px rgba(242,196,106,.07), inset 0 -14px 22px rgba(0,0,0,.28); }
  .skin .sec, .skin .mapbtns button {
    clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut)); }
  .skin .sec { --cut: 12px; }
  .skin .mapbtns button { --cut: 7px; }
  .skin .sec::before, .skin .sec::after { content: ''; position: absolute; width: 26px; height: 26px; pointer-events: none; z-index: 1; }
  .skin .sec::before { left: 0; top: 0; background: linear-gradient(135deg, transparent 0 7.4px, var(--gold) 7.4px 9.4px, transparent 9.4px); }
  .skin .sec::after { right: 0; bottom: 0; background: linear-gradient(135deg, transparent 0 27.3px, var(--gold) 27.3px 29.3px, transparent 29.3px); }
  /* status bar */
  .skin .maptop { position: absolute; left: 0; right: 0; top: 0; height: 34px; box-sizing: border-box; display: flex; align-items: center;
    justify-content: space-between; gap: 16px; padding: 0 14px; border-width: 0 0 1px; border-color: #3a3020; color: #8fa3b2;
    font: 600 11px -apple-system, sans-serif; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; overflow: hidden; }
  .skin .maptop .tl, .skin .maptop .tr { display: flex; align-items: center; gap: 13px; min-width: 0; }
  /* the left part gives way when the bar is full (the pointer's position is cut first) */
  .skin .maptop .tl { flex: 1 1 auto; overflow: hidden; }
  .skin .maptop .tr { flex: none; }
  .skin .maptop .tptr { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  /* narrow windows: while the cursor is over the map, its position takes the place of the ship's */
  @media (max-width: 1439px) { .skin .maptop .tpos:has(+ .tptr:not(:empty)) { display: none; } .skin .maptop .tl, .skin .maptop .tr { gap: 9px; } }
  .skin .maptop b { color: #dfe6ec; font-weight: 600; }
  .skin .maptop .tv { color: #f2c46a; }
  .skin .maptop .tlogo { color: #f2c46a; font-weight: 800; font-size: 13px; letter-spacing: .12em; }
  .skin .maptop .tlogo svg { width: 24px; height: 14px; vertical-align: -2px; fill: #f2c46a; margin-right: 7px; }
  .skin .maptop .tsep { width: 1px; height: 16px; background: #3a4850; flex: none; }
  .skin .maptop .tclock b { font-size: 16px; color: #f2c46a; letter-spacing: .04em; font-weight: 700; }
  .skin .maptop .tclock small { margin-left: 8px; color: #8fa3b2; font-size: 11px; }
  .skin .maptop svg.wxi { width: 18px; height: 13px; vertical-align: -2px; margin: 0 4px; fill: #b8c4cf; }
  .skin .tdot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin: 0 5px 0 7px; background: #2a3238; vertical-align: 0; }
  .skin .tdot.ok { background: #6be06b; box-shadow: 0 0 6px #6be06b; }
  .skin .tdot.warn { background: #f2c21b; box-shadow: 0 0 6px #f2c21b; }
  .skin .tdot.bad { background: #ef5a4a; box-shadow: 0 0 6px #ef5a4a; }
  /* the left column */
  .skin .sec > header { display: flex; align-items: center; gap: 7px; padding: 4px 10px 3px 15px; font: 700 12px -apple-system, sans-serif;
    letter-spacing: .08em; text-transform: uppercase; border-bottom: 1px solid rgba(242,196,106,.16); }
  .skin .sec > header .grow { flex: 1; }
  .skin .sec > header .hsub { font-weight: 600; color: #8fa3b2; letter-spacing: .04em; }
  .skin .sec > header > svg { width: 16px; height: 12px; fill: #8fe9ff; flex: none; }
  .skin .sec > header button { padding: 3px 9px; font-size: 11px; background: rgba(8,24,32,.7); border: 1px solid #2c6f8a; border-radius: 3px; }
  .skin .sec > header button:hover { background: #12384a; }
  .skin .sec > header button.fold { padding: 0 4px; border: 0; background: none; color: #8fa3b2; font-size: 13px; }
  .skin .sec.folded > :not(header) { display: none; }
  .skin .sec.folded > header { border-bottom: 0; }
  .skin .sec.folded > header button.fold { transform: rotate(180deg); }
  .skin .sbody { padding: 6px 10px 7px 15px; }
  .skin .sec > header button.hbtn { padding: 2px 5px; display: flex; }
  .skin .sec > header button.hbtn svg { width: 15px; height: 15px; fill: none; stroke: #8fe9ff; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .skin .picto { display: inline-block; width: 21px; height: 12px; margin-right: 4px; vertical-align: -2px; flex: none; }
  .skin .picto svg { display: block; width: 100%; height: 100%; fill: currentColor; filter: drop-shadow(0 0 2px currentColor); }
  .skin .lamp { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #2a3238; box-shadow: inset 0 0 0 1px rgba(0,0,0,.5); }
  .skin .lamp.ok { background: #6be06b; box-shadow: 0 0 6px #6be06b; }
  .skin .lamp.idle { background: #3d7a45; }
  .skin .lamp.warn { background: #f2c21b; box-shadow: 0 0 6px #f2c21b; }
  .skin .lamp.bad { background: #ef5a4a; box-shadow: 0 0 7px #ef5a4a; }
  .skin .lamp.hit { background: #ff6a4a; box-shadow: 0 0 9px #ff6a4a; animation: lamphit .35s steps(2, jump-none) infinite; }
  @keyframes lamphit { 50% { background: #3a1410; box-shadow: none; } }
  .skin .ucmds { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; padding: 7px 10px 8px 15px; }
  .skin .ucmds:empty { display: none; }
  .skin .ucmds button { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 6px 6px; font-size: 11px; letter-spacing: .05em;
    text-transform: uppercase; background: rgba(8,24,32,.85); border: 1px solid #2c6f8a; border-radius: 3px; white-space: nowrap; overflow: hidden; }
  .skin .ucmds button svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .skin .ucmds button:hover { background: #12384a; }
  .skin .ucmds button.on { border-color: rgba(var(--cyan),.9); color: #8fe9ff; background: rgba(var(--cyan),.12); box-shadow: inset 0 0 10px rgba(var(--cyan),.2); }
  /* ship and supply */
  .skin .mapfuel .fgauge { display: flex; align-items: center; gap: 10px; margin-top: 6px; color: #dfe6ec; }

  .skin .mapfuel .ffill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; }
  .skin .mapfuel .fneed { position: absolute; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; background: #5fd6ab; box-shadow: 0 0 0 1px #0b1a26; }
  .skin .mapfuel .fpct { font-weight: 700; min-width: 40px; text-align: right; font-variant-numeric: tabular-nums; }
  .skin .mapfuel .ftext { margin-top: 5px; color: #b8c4cf; }
  .skin .mapfuel .ftext b { color: #dfe6ec; }
  .skin .mapfuel .ftext b.depot { color: #5fd6ab; }
  .skin .mapfuel .warn { color: #ff8a6a; }
  .skin .mapfuel .fdrone { color: #8fa3b2; font-size: 11px; margin-top: 2px; }
  .skin .mapfuel .fbtns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-top: 5px; }

  .skin .mapfuel .fbtns button:hover { background: #12384a; }

  .skin .mapfuel.low .fbar { animation: fuelblink 1s steps(2, jump-none) infinite; }
  @keyframes fuelblink { 50% { border-color: #ef5a4a; } }
  /* time and weather with the forecast */
  .skin .wxnow { display: flex; align-items: baseline; gap: 4px 12px; flex-wrap: wrap; color: #8fa3b2; }
  .skin .wxnow b { color: #dfe6ec; font-weight: 600; }
  .skin .wxnow .wxclock { font-size: 18px; color: #f2c46a; font-weight: 700; letter-spacing: .03em; }
  .skin .wxnow small { color: #8fa3b2; margin-left: -6px; }
  .skin .wxfc { margin-top: 4px; padding-top: 3px; border-top: 1px solid rgba(255,255,255,.08); color: #b8c4cf; }
  .skin .wxwind { display: grid; grid-template-columns: repeat(6, 1fr); align-items: center; gap: 4px; margin-top: 4px; padding-top: 3px; border-top: 1px solid rgba(255,255,255,.08); }
  .skin .wxwind > span:first-child { grid-column: 1 / -1; }
  .skin .ws small { white-space: nowrap; }
  .skin .wxwind > span { color: #8fa3b2; text-transform: uppercase; font-size: 11px; letter-spacing: .06em; margin-right: 4px; }
  .skin .ws { display: flex; flex-direction: column; align-items: center; padding: 1px 0; background: rgba(8,24,32,.55); border: 1px solid #22323a; border-radius: 3px; }

  .skin .ws svg { width: 13px; height: 13px; fill: currentColor; }
  .skin .ws b { font-size: 12px; font-variant-numeric: tabular-nums; }
  .skin .ws.calm { color: #8fa3b2; }
  .skin .ws.light { color: #8fe9ff; }
  .skin .ws.fresh { color: #f2c21b; }
  .skin .ws.storm { color: #ff7a5a; }
  .skin .wxfc > span { color: #8fa3b2; text-transform: uppercase; font-size: 11px; letter-spacing: .06em; margin-right: 6px; }
  .skin .wxfc b { color: #dfe6ec; font-weight: 600; }
  .skin svg.wxi { width: 17px; height: 12px; vertical-align: -1px; margin-right: 4px; fill: #b8c4cf; }
  /* island information at the pointer */

  .skin .montile .mnoise { position: absolute; inset: 0; opacity: 0; background-size: 96px; mix-blend-mode: screen; pointer-events: none; }
  .skin .montile .mlabel { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; gap: 2px; padding: 3px 6px 8px;

  #presents { position: fixed; inset: 0; z-index: 61; background: #000; display: flex; align-items: center; justify-content: center;

    animation: presentsText 2.4s .4s forwards; }
  @keyframes presentsText { 0% { opacity: 0; animation-timing-function: steps(4, end); } 15% { opacity: 1; } 80% { opacity: 1; animation-timing-function: steps(4, end); } 100% { opacity: 0; } }
  @keyframes presentsOut { to { opacity: 0; } }
  @media (max-height: 760px) { #presents { --px: 2px; } }
  @media (min-height: 1300px) { #presents { --px: 4px; } }
  /* the loading screen: black (after the splash), with a streak of light while the world is made; it fades into the intro */
  #boot { position: fixed; inset: 0; z-index: 60; background: #000; transition: opacity .9s ease; }
  /* into the intro the whole scene comes up slowly out of the black */
  #boot.slow { transition-duration: 3s; transition-timing-function: ease-in-out; }
  #boot.gone { opacity: 0; pointer-events: none; }
  #boot i { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; overflow: hidden; background: rgba(4,12,18,.6); }
  #boot i::after { content: ''; position: absolute; top: 0; bottom: 0; left: 0; width: 30%; background: linear-gradient(90deg, transparent, #f2c46a, transparent);
    animation: bootrun 1.6s ease-in-out infinite; }
  @keyframes bootrun { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
  /* loaded, waiting for the click or key that lets the music start */
  #boot b { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: none; padding: 9px 22px; border: 1px solid rgba(242,196,106,.7);
    border-radius: 999px; background: rgba(4,12,18,.62); color: #f2e6c8; font: 700 15px -apple-system, sans-serif; letter-spacing: .14em; text-transform: uppercase;
    box-shadow: 0 0 22px rgba(242,196,106,.25); animation: bootpulse 2s ease-in-out infinite; }
  #boot.wait { cursor: pointer; }
  #boot.wait b { display: block; }
  #boot.wait i { display: none; }
  @keyframes bootpulse { 50% { opacity: .55; } }
  /* title and pause menu: the logo stands free on the picture, under it a slim panel of frosted glass with the entries as a list */
  #menu { position: fixed; inset: 0; display: none; flex-direction: column; align-items: flex-start; justify-content: safe center; gap: 6px; z-index: 40; overflow: auto;
    padding-left: max(0px, 5vw); background: linear-gradient(90deg, rgba(4,12,18,.45), rgba(4,12,18,.12) 38%, rgba(4,12,18,0) 55%);
    --logo: min(500px, 34vw, 54vh); }
  #menu:has(.panel.wide) { align-items: center; padding-left: 0; background: rgba(4,12,18,.72); --logo: min(380px, 30vw, 40vh); }
  /* the panel is a console tile (.skin .sec: cut corners, gold strokes), here as glass: the storm shows through, blurred */
  #menu .panel { width: min(clamp(340px, 25vw, 420px), calc(100% - 32px)); margin: 0 16px 24px calc(16px + var(--logo) * .08); padding: 12px 20px;
    flex: none; box-sizing: border-box; color: #dfe6ec; font: 13px/1.45 -apple-system, BlinkMacSystemFont, sans-serif; --cut: 16px;
    background: linear-gradient(90deg, rgba(242,196,106,.45), rgba(242,196,106,0) 55%) top left / 100% 1px no-repeat, rgba(10,17,24,.56);
    backdrop-filter: blur(14px) saturate(1.15); -webkit-backdrop-filter: blur(14px) saturate(1.15); box-shadow: none; }
  #menu .panel::before { width: 34px; height: 34px; background: linear-gradient(135deg, transparent 0 10.3px, var(--gold) 10.3px 12.3px, transparent 12.3px); }
  #menu .panel::after { width: 34px; height: 34px; background: linear-gradient(135deg, transparent 0 35.8px, var(--gold) 35.8px 37.8px, transparent 37.8px); }
  #menu .panel.wide { width: min(760px, calc(100% - 32px)); margin: 0 16px 24px; padding: 18px 24px 16px; }
  #menu .logo { font-size: 30px; font-weight: 800; letter-spacing: .12em; color: #f2c46a; line-height: 1.1; margin: 0 16px; }
  /* (the picture's subtitle line under the letters is cut off: the logo shows down to y 728 of 887, as on the app icon) */
  #menu .logoimg { display: block; flex: none; width: var(--logo); height: auto; aspect-ratio: 1774 / 728; object-fit: cover; object-position: top;
    margin: 24px 16px 0; user-select: none; pointer-events: none; filter: drop-shadow(0 6px 18px rgba(0,0,0,.55)); }
  /* the text pages (guide, controls, credits, saves) need the height: no logo above them in lower windows */
  @media (max-height: 900px) { #menu:has(.panel.wide) .logoimg { display: none; } }
  #menu .logo span { display: block; font-size: 12px; letter-spacing: .4em; color: #8fa3b2; font-weight: 600; margin-top: 3px; }
  #menu .tag { color: #ffb36a; font-weight: 700; letter-spacing: .3em; font-size: 12px; margin: 2px 0 8px; }
  #menu .tag:empty { display: none; }
  #menu .h { font: 700 12px -apple-system, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #dfe6ec; margin: 2px 0 10px;
    padding-bottom: 5px; border-bottom: 1px solid rgba(242,196,106,.16); }
  #menu button { display: block; width: 100%; text-align: left; margin: 6px 0; padding: 9px 14px; font: 600 14px -apple-system, sans-serif;
    letter-spacing: .03em; color: #dfe6ec; background: rgba(8,24,32,.85); border: 1px solid #2c6f8a; border-radius: 3px; cursor: pointer; }

  #menu button:hover, #menu button:focus-visible, #menu input:focus-visible { outline: none; border-color: #f2c46a; background: #12384a; }
  #menu button.arm { border-color: #ef8a6a; color: #ffb59a; }
  /* the plain entries as a list: no frames, a fine line between them; the big one (continue, start) keeps its gold frame */
  #menu .body > button:not(.big):not(.small) { background: transparent; border: 0; border-bottom: 1px solid rgba(143,163,178,.16); border-radius: 0;
    margin: 0; padding: 9px 4px; font-size: 15px; }
  #menu .body > button.big { margin: 4px 0 8px; }
  #menu .body > button.small { background: transparent; border-color: rgba(143,163,178,.25); }
  #menu .panel .body > button:is(:hover, :focus-visible) { background: rgba(18,56,74,.7); border-color: #f2c46a; }
  #menu label { display: block; margin: 10px 0 4px; color: #b8c4cf; }
  #menu input[type=number], #menu input[type=text] { display: block; width: 100%; box-sizing: border-box; margin-top: 4px; padding: 7px 10px;
    font: 600 14px -apple-system, sans-serif; color: #dfe6ec; background: rgba(0,0,0,.25); border: 1px solid #2c6f8a; border-radius: 3px; }
  #menu input[type=range] { display: block; width: 100%; margin-top: 6px; accent-color: #c79b38; }
  #menu .count { color: #f2c46a; font-weight: 700; }

  #menu .note.bad { color: #ff9a7a; }
  #menu .ver { color: #5f7484; font-size: 11px; margin: 4px 0 0; font-variant-numeric: tabular-nums; }
  /* the intro on the first start: the story rolls up over the stormy title; the menu waits hidden and fades in after it */
  #menu { transition: opacity .8s ease; }
  body.intro #menu { opacity: 0; visibility: hidden; }
  /* the whole picture dims and softens behind it (no band: an even veil), so the rain does not run through the letters */
  #intro { position: fixed; inset: 0; z-index: 45; transition: opacity .8s ease; animation: introIn .8s ease backwards; background: rgba(4,12,18,.52);
    backdrop-filter: blur(4px) saturate(.85); -webkit-backdrop-filter: blur(4px) saturate(.85); }
  #intro.gone { opacity: 0; pointer-events: none; }
  @keyframes introIn { from { opacity: 0; } }
  #intro .view { position: absolute; inset: 0; overflow: hidden;
    -webkit-mask-image: linear-gradient(transparent 0, #000 16%, #000 90%, transparent 100%); mask-image: linear-gradient(transparent 0, #000 16%, #000 90%, transparent 100%); }
  #intro .crawl { position: absolute; left: 50%; top: 0; width: min(640px, calc(100% - 48px)); transform: translate(-50%, var(--from, 100vh));
    color: #e8eef3; font: 19px/1.6 -apple-system, BlinkMacSystemFont, sans-serif; text-align: justify; hyphens: auto;
    text-shadow: 0 1px 2px rgba(0,0,0,.95), 0 0 10px rgba(0,0,0,.8), 0 0 26px rgba(0,0,0,.6); }
  #intro .crawl.run { animation: introCrawl linear forwards; }
  @keyframes introCrawl { from { transform: translate(-50%, var(--from)); } to { transform: translate(-50%, var(--to)); } }

    margin: 0 auto 36px; filter: drop-shadow(0 6px 18px rgba(0,0,0,.6)); }
  #intro .crawl p { margin: 0 0 1.2em; }
  #intro .crawl b { color: #f2c46a; font-weight: 700; }
  #intro .crawl .homage { color: #c9d4dd; font-style: italic; font-size: 17px; padding-bottom: 1.4em; margin-bottom: 1.6em; border-bottom: 1px solid rgba(242,196,106,.25); }
  #intro .crawl .last { margin-top: 2.2em; text-align: center; color: #f2c46a; font-weight: 700; letter-spacing: .06em; }
  #intro .skip { position: absolute; right: 24px; bottom: 18px; color: #b8c4cf; font: 600 12px -apple-system, sans-serif; letter-spacing: .05em;

  #menu h3 { margin: 10px 0 2px; font-size: 12px; letter-spacing: .08em; color: #f2c46a; }

  #menu p.legal { color: #8fa3b2; font-size: 11px; margin: 10px 0 4px; }
  #menu p.byline { font-size: 15px; color: #dfe6ec; margin: 2px 0 8px; }
  #menu p.byline b { color: #f2c46a; }
  #menu .endtitle { font: 800 30px -apple-system, sans-serif; letter-spacing: .18em; margin: 4px 0 6px; }

  #menu .diffs button { flex: 1; text-align: center; margin: 2px 0; }

  #menu label.check { display: flex; align-items: center; gap: 8px; margin: 12px 0 0; color: #dfe6ec; cursor: pointer; }

<script>
  // before the first picture of every start; the game's own reloads (another world, back to the title) say so first and go
  // straight to the loading picture. (Not "once a session": the app keeps its session storage from one start to the next.)
  // (the game reads the class "reload" too: no intro then, straight to the menu)
  try { if (sessionStorage.getItem('skerry-reload')) { sessionStorage.removeItem('skerry-reload'); document.getElementById('presents').remove(); document.documentElement.classList.add('reload'); } } catch (e) { /* storage blocked: it shows */ }
</script>
